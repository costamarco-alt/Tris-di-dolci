<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd1e6">
  <meta name="description" content="Gioco puzzle a tema caramelle: allinea tre dolci uguali. Senza pubblicità, senza vite, senza acquisti.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tris di Dolci">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Tris di Dolci</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app">
    <section id="screen-menu" class="screen screen-menu"></section>
    <section id="screen-map" class="screen screen-map" hidden></section>
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="top">
        <div class="bar">
          <button id="btn-back" class="icon-button" type="button"></button>
          <div class="bar-title">Tris di Dolci</div>
          <button id="btn-settings" class="icon-button" type="button"></button>
        </div>
        <div id="hud" class="hud"></div>
      </header>
      <main class="board-area">
        <div id="board" class="board" role="application"></div>
      </main>
    </section>
    <div id="overlay" class="overlay" hidden></div>
    <button id="update-banner" class="update-banner" type="button" hidden></button>
    <div id="loading" class="loading">
      <div class="loading-title">Tris di Dolci</div>
      <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <noscript><p class="noscript">Per giocare serve JavaScript attivo.</p></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
